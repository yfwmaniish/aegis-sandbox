# Aegis Sandbox — full control-plane data plane (TRD §3.10).
# This is Zone A (control plane) + datastores. The detonation zone (Zone C: KVM VMs /
# Android emulators) is deliberately NOT here — it is network-isolated and plugs into
# the orchestrator interface separately.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aegis
      MINIO_ROOT_PASSWORD: aegis-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Create the canonical buckets once MinIO is up.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aegis aegis-secret &&
      mc mb -p local/aegis-samples local/aegis-artifacts || true;
      mc anonymous set none local/aegis-samples;
      exit 0;
      "

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports: ["9200:9200"]
    volumes: ["osdata:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      AEGIS_ENV: prod
      AEGIS_INLINE_TASKS: "false"
      DATABASE_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: aegis
      S3_SECRET_KEY: aegis-secret
      OPENSEARCH_URL: http://opensearch:9200
      QDRANT_URL: http://qdrant:6333
      AEGIS_JWT_SECRET: ${AEGIS_JWT_SECRET:-change-me-in-prod}
    ports: ["8000:8000"]
    # Apply migrations, then serve.
    command: >
      /bin/sh -c "alembic upgrade head &&
      uvicorn aegis.api.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      AEGIS_ENV: prod
      AEGIS_INLINE_TASKS: "false"
      DATABASE_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: aegis
      S3_SECRET_KEY: aegis-secret
    command: celery -A aegis.worker.celery_app.celery_app worker --loglevel=info -Q normal,high

volumes:
  pgdata:
  miniodata:
  osdata:
  qdrantdata:
